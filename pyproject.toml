[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siteceline"
version = "0.2.0"
description = "Núcleo local, auditável e governado do ecossistema CELINE"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
celine = "celine.api:main"

[tool.setuptools]
packages = ["celine"]
py-modules = ["core_neural_mesh"]
